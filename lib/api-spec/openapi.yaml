openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Life Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: home
    description: Home tab data
  - name: daily
    description: Daily tab data
  - name: work
    description: Work tab data
  - name: consulting
    description: Consulting tab data
  - name: money
    description: Money tab data
  - name: health
    description: Health tab data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # HOME
  /home/todos:
    get:
      operationId: getTodos
      tags: [home]
      summary: Get today's todos
      responses:
        "200":
          description: List of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
    post:
      operationId: createTodo
      tags: [home]
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"

  /home/todos/{id}:
    patch:
      operationId: updateTodo
      tags: [home]
      summary: Update a todo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodoInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
    delete:
      operationId: deleteTodo
      tags: [home]
      summary: Delete a todo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /home/priorities:
    get:
      operationId: getPriorities
      tags: [home]
      summary: Get top 3 priorities
      responses:
        "200":
          description: List of priorities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Priority"
    post:
      operationId: createPriority
      tags: [home]
      summary: Create a priority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePriorityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Priority"

  /home/priorities/{id}:
    patch:
      operationId: updatePriority
      tags: [home]
      summary: Update a priority
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePriorityInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Priority"
    delete:
      operationId: deletePriority
      tags: [home]
      summary: Delete a priority
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /home/condition:
    get:
      operationId: getCondition
      tags: [home]
      summary: Get today's condition
      responses:
        "200":
          description: Condition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condition"
    put:
      operationId: upsertCondition
      tags: [home]
      summary: Set today's condition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertConditionInput"
      responses:
        "200":
          description: Updated condition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condition"

  /home/memo:
    get:
      operationId: getHomeMemo
      tags: [home]
      summary: Get home memo
      responses:
        "200":
          description: Memo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memo"
    put:
      operationId: upsertHomeMemo
      tags: [home]
      summary: Upsert home memo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertMemoInput"
      responses:
        "200":
          description: Memo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memo"

  # DAILY
  /daily/memo:
    get:
      operationId: getDailyMemo
      tags: [daily]
      summary: Get daily memo
      responses:
        "200":
          description: Memo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memo"
    put:
      operationId: upsertDailyMemo
      tags: [daily]
